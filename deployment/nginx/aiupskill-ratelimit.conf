# SEC-49 (04.11.2026): aiupskill.live /api/ai-audit fetched arbitrary URLs and called a paid LLM per request;
# scanners from rotating proxies hammered it. Global + per-IP caps; scripted clients refused.
limit_req_zone $server_name zone=aiupskill_audit_global:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=aiupskill_audit_ip:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=aiupskill_lead_ip:10m rate=2r/m;
map $http_user_agent $aiupskill_scripted {
    default 0;
    "" 1;
    ~*(python|urllib|curl/|wget|go-http-client|aiohttp|httpx|libwww|okhttp|java/|node-fetch|axios/|scrapy) 1;
}

# Форми сайту шлють fetch зі сторінки aiupskill.live, тож браузер ставить Origin сам.
map $http_origin $aiupskill_foreign_origin {
    default 1;
    "https://aiupskill.live" 0;
    "https://www.aiupskill.live" 0;
}
